<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>分享卡字型測試 · 港式 MBTI</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="gfontA" href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Archivo+Black&family=Anton&family=Abril+Fatface&family=Bebas+Neue&family=JetBrains+Mono:wght@800&family=Oswald:wght@700&family=Playfair+Display:wght@900&family=Space+Grotesk:wght@700&family=Syne:wght@800&text=EIJSFNTP-A&display=block" rel="stylesheet">
<link id="gfontB" href="https://fonts.googleapis.com/css2?family=Bangers&family=Caveat+Brush&family=Kalam:wght@700&family=Nanum+Pen+Script&family=Pacifico&family=Permanent+Marker&family=Rock+Salt&family=Satisfy&family=Shadows+Into+Light&text=EIJSFNTP-A&display=block" rel="stylesheet">
<style>
:root{--gold:#D4A95F}
*{box-sizing:border-box}
body{margin:0;background:#12161d;color:#F5F1E8;font-family:"PingFang HK","PingFang TC","Noto Sans HK",sans-serif;padding:18px 16px 70px;}
h1{font-size:1.3rem;font-weight:900;margin:0 0 8px;letter-spacing:-.01em}
p.lead{font-size:.9rem;color:#B9B2A4;line-height:1.65;margin:0 0 6px}
p.lead b{color:var(--gold)}
.block{margin:0 0 24px;background:#1B2029;border:1px solid rgba(212,169,95,.18);border-radius:18px;padding:13px 13px 12px}
.hd{display:flex;align-items:baseline;gap:9px;margin:0 0 10px;flex-wrap:wrap}
.no{font-size:1.02rem;font-weight:900}
.nm{font-size:.9rem;color:#E4DCCB;font-weight:700}
.tag{font-size:.72rem;color:#8E8779}
img.card{width:100%;display:block;border-radius:12px;box-shadow:0 6px 22px rgba(0,0,0,.4)}
.strip{display:block;width:100%;margin-top:9px;border-radius:10px;background:#0E1218;border:1px solid rgba(255,255,255,.06)}
.note{font-size:.8rem;color:#B9B2A4;margin:9px 2px 0;line-height:1.55}
.metrics{font-size:.7rem;color:#6F6A60;margin-top:5px}
.grp{font-size:.95rem;font-weight:900;color:var(--gold);margin:26px 2px 10px;letter-spacing:.01em}
.grp:first-child{margin-top:6px}
.warnbox{background:rgba(224,128,90,.12);border:1px solid rgba(224,128,90,.4);color:#E8A185;font-size:.78rem;font-weight:700;border-radius:10px;padding:7px 10px;margin:0 0 9px}
#boot{font-size:.85rem;color:var(--gold);margin:0 0 14px}
</style>
</head>
<body>
<h1>分享卡中間四個大字母 · 字型測試</h1>
<p class="lead">每格都係用<b>真身分享卡生成器</b>畫出嚟（同一個 INFP、同一張卡），淨係換中間四個大字母嘅字型。</p>
<p class="lead">分兩組：<b>A</b> 字體排印款、<b>B</b> 手寫／筆觸款（新加）。</p>
<p class="lead">睇完記住號碼話我知，例如「用 ⑤」。</p>
<p id="boot">字型載入中…</p>
<div id="mount"></div>
<iframe id="app" src="index.html?a=1" title="app" style="position:absolute;width:720px;height:1400px;left:-9999px;top:0;border:0"></iframe>
<script>
const GF_HREFS = ['gfontA','gfontB'].map(id => document.getElementById(id).href);
const CANDIDATES = [
 {no:'①', group:'A · 字體排印款（襯線／無襯線）', name:'現況（系統襯線）', stack:'Georgia, "Times New Roman", serif', need:null, note:'而家分享卡用緊嘅（bold 240px serif）', tag:'現況'},
 {no:'②', group:'A · 字體排印款（襯線／無襯線）', name:'Amatic SC', stack:'"Amatic SC", cursive', need:'700 240px "Amatic SC"', note:'現時 16 型格用緊 —— 你話太難睇嗰隻，擺出嚟對照', tag:'現況（16 型格）'},
 {no:'③', group:'A · 字體排印款（襯線／無襯線）', name:'Archivo Black', stack:'"Archivo Black", sans-serif', need:'400 240px "Archivo Black"', note:'超粗無襯線，最清楚最穩', tag:'候選'},
 {no:'④', group:'A · 字體排印款（襯線／無襯線）', name:'Anton', stack:'Anton, sans-serif', need:'400 240px "Anton"', note:'窄身重體，海報感', tag:'候選'},
 {no:'⑤', group:'A · 字體排印款（襯線／無襯線）', name:'Bebas Neue', stack:'"Bebas Neue", sans-serif', need:'400 240px "Bebas Neue"', note:'高瘦大寫，型格', tag:'候選'},
 {no:'⑥', group:'A · 字體排印款（襯線／無襯線）', name:'Abril Fatface', stack:'"Abril Fatface", serif', need:'400 240px "Abril Fatface"', note:'肥 didone，最搶眼', tag:'候選'},
 {no:'⑦', group:'A · 字體排印款（襯線／無襯線）', name:'Playfair Display 900', stack:'"Playfair Display", serif', need:'900 240px "Playfair Display"', note:'高反差襯線，優雅', tag:'候選'},
 {no:'⑧', group:'A · 字體排印款（襯線／無襯線）', name:'Space Grotesk 700', stack:'"Space Grotesk", sans-serif', need:'700 240px "Space Grotesk"', note:'幾何科技感', tag:'候選'},
 {no:'⑨', group:'A · 字體排印款（襯線／無襯線）', name:'Syne 800', stack:'Syne, sans-serif', need:'800 240px "Syne"', note:'前衛幾何，最有個性', tag:'候選'},
 {no:'⑩', group:'A · 字體排印款（襯線／無襯線）', name:'JetBrains Mono 800', stack:'"JetBrains Mono", monospace', need:'800 240px "JetBrains Mono"', note:'等寬字，科技感', tag:'候選'},
 {no:'⑪', group:'A · 字體排印款（襯線／無襯線）', name:'Oswald 700', stack:'Oswald, sans-serif', need:'700 240px "Oswald"', note:'窄身高身，清爽易讀', tag:'候選'},
 {no:'⑫', group:'B · 手寫／筆觸款', name:'Permanent Marker', stack:'"Permanent Marker", cursive', need:'400 240px "Permanent Marker"', note:'箱頭筆手寫，粗、型、易讀', tag:'新加'},
 {no:'⑬', group:'B · 手寫／筆觸款', name:'Caveat Brush', stack:'"Caveat Brush", cursive', need:'400 240px "Caveat Brush"', note:'毛筆感手寫，生動', tag:'新加'},
 {no:'⑭', group:'B · 手寫／筆觸款', name:'Kalam 700', stack:'Kalam, cursive', need:'700 240px "Kalam"', note:'軟筆手寫，有筆鋒', tag:'新加'},
 {no:'⑮', group:'B · 手寫／筆觸款', name:'Bangers', stack:'Bangers, cursive', need:'400 240px "Bangers"', note:'漫畫手寫大寫，搶眼又清楚', tag:'新加'},
 {no:'⑯', group:'B · 手寫／筆觸款', name:'Pacifico', stack:'Pacifico, cursive', need:'400 240px "Pacifico"', note:'圓潤毛筆連筆，好 signature 感', tag:'新加'},
 {no:'⑰', group:'B · 手寫／筆觸款', name:'Satisfy', stack:'Satisfy, cursive', need:'400 240px "Satisfy"', note:'流暢連筆，優雅手寫', tag:'新加'},
 {no:'⑱', group:'B · 手寫／筆觸款', name:'Shadows Into Light', stack:'"Shadows Into Light", cursive', need:'400 240px "Shadows Into Light"', note:'鉛筆細字手寫，清秀', tag:'新加'},
 {no:'⑲', group:'B · 手寫／筆觸款', name:'Rock Salt', stack:'"Rock Salt", cursive', need:'400 240px "Rock Salt"', note:'塗鴉手寫，夠 raw（字母較難認）', tag:'新加'},
 {no:'⑳', group:'B · 手寫／筆觸款', name:'Nanum Pen Script', stack:'"Nanum Pen Script", cursive', need:'400 240px "Nanum Pen Script"', note:'原子筆手寫，輕盈', tag:'新加'}
];
const ALL16 = ['INTJ','INTP','ENTJ','ENTP','INFJ','INFP','ENFJ','ENFP','ISTJ','ISFJ','ESTJ','ESFJ','ISTP','ISFP','ESTP','ESFP'];
const sleep = ms => new Promise(r => setTimeout(r, ms));
// 量 ink 闊度再決定字級，確保四個字母放得落卡（左右各 60px 邊距 → 最多 600px）
const measureCtx = document.createElement('canvas').getContext('2d');
function fitSize(stack, text, maxW, base){
  measureCtx.font = 'bold ' + base + 'px ' + stack;
  const w = measureCtx.measureText(text).width;
  return { size: w > maxW ? Math.round(base * maxW / w) : base, width: Math.round(w) };
}

function stripCanvas(stack){
  const c = document.createElement('canvas');
  c.width = 1440; c.height = 200;      // 2x
  const x = c.getContext('2d');
  x.fillStyle = '#0E1218'; x.fillRect(0,0,c.width,c.height);
  x.fillStyle = '#E4DCCB'; x.textBaseline = 'middle';
  const per = 8, cw = c.width / per;
  ALL16.forEach((code, i) => {
    const col = i % per, row = Math.floor(i / per);
    const f = fitSize(stack, code, cw - 28, 66);
    x.font = '700 ' + f.size + 'px ' + stack;
    x.textAlign = 'center';
    x.fillText(code, cw * col + cw/2, 55 + row * 90);
  });
  return c.toDataURL('image/png');
}

(async () => {
  const ifr = document.getElementById('app');
  const mount = document.getElementById('mount');
  const boot = document.getElementById('boot');
  for (let i = 0; i < 100; i++) { try { if (typeof ifr.contentWindow.generateCardImage === 'function' && ifr.contentWindow.TYPES) break; } catch(e){} await sleep(150); }
  const W = ifr.contentWindow, D = ifr.contentDocument;
  // 注入候選字型去 iframe（canvas 要喺同一個 document 先用到）
  for (const href of GF_HREFS){ const lk = D.createElement('link'); lk.rel = 'stylesheet'; lk.href = href; D.head.appendChild(lk); }
  // 假資料
  W.state.displayName = '小明'; W.state.nickname = '港女'; W.state.version = 'life'; W.state.totalQ = 60;
  W.lastResult = 'INFP';
  const loaded = [];
  for (const f of CANDIDATES) {
    if (!f.need) { loaded.push(true); continue; }
    let ok = false;
    try { await D.fonts.load(f.need, 'INFP'); ok = D.fonts.check(f.need, 'INFP') && W.document.fonts.check(f.need, 'INFP'); } catch(e){ ok = false; }
    if (!ok) { try { await D.fonts.load(f.need, 'INFP'); ok = D.fonts.check(f.need, 'INFP'); } catch(e){} }
    loaded.push(ok);
  }
  const probe = document.createElement('canvas').getContext('2d');
  let html = '', lastGroup = '';
  for (let i = 0; i < CANDIDATES.length; i++) {
    const f = CANDIDATES[i];
    if (f.group !== lastGroup) { html += '<h2 class="grp">' + f.group + '</h2>'; lastGroup = f.group; }
    const fit = fitSize(f.stack, 'INFP', 600, 240);
    W.CARD_CODE_FONT = 'bold ' + fit.size + 'px ' + f.stack;
    await W.generateCardImage();
    const url = D.getElementById('shareCardImg').src;
    const warn = (f.need && !loaded[i]) ? '<div class="warnbox">注意：呢款字型喺你部機載入唔到，上面睇到嘅係系統代替字</div>' : '';
    const sizeNote = fit.size === 240
      ? '字級 240px（同而家一樣）'
      : '字級自動縮到 ' + fit.size + 'px 先放得落卡（原本 240px 會闊 ' + fit.width + 'px，超出卡邊）';
    html += '<div class="block"><div class="hd"><span class="no">' + f.no + '</span><span class="nm">' + f.name + '</span><span class="tag">' + f.tag + '</span></div>' + warn
          + '<img class="card" alt="' + f.name + '" src="' + url + '">'
          + '<img class="strip" alt="16 型對照" src="' + stripCanvas(f.stack) + '">'
          + '<div class="note">' + f.note + '</div>'
          + '<div class="metrics">' + sizeNote + ' ' + warn + '</div></div>';
  }
  mount.innerHTML = html;
  const bad = CANDIDATES.filter((f, i) => f.need && !loaded[i]).map(f => f.name);
  boot.textContent = bad.length ? '完成（有 ' + bad.length + ' 款未載入：' + bad.join('、') + '）' : '完成 — 全部 ' + CANDIDATES.length + ' 款都載入成功，可以揀';
  document.title = '完成 · 分享卡字型測試';
  window.__done = true;
})();
</script>
</body>
</html>
