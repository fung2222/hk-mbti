<script>
function siteBack(){
try{
if(document.referrer){
var u = new URL(document.referrer, location.href);
if(u.origin === location.origin){ history.back(); return; }
 }
 }catch(e){}
location.href = './';
}

// Hero menu (一行式 header 用)
function toggleHeroMenu(e){
if(e) e.stopPropagation();
const p = document.getElementById('heroPopover');
if(p) p.classList.toggle('open');
}
function closeHeroMenu(){
const p = document.getElementById('heroPopover');
if(p) p.classList.remove('open');
}
document.addEventListener('click', function(e){
if(!e.target.closest('.hero-popover') && !e.target.closest('.hero-menu')) closeHeroMenu();
});
// 載入 localStorage
function loadHistory(){
let arr = [];
try{ arr = JSON.parse(localStorage.getItem("hkmbti_history")||"[]") || []; }catch(e){ arr = []; }
 // 兼容舊版 hkmbti_last_result
try{
if(arr.length === 0){
const last = localStorage.getItem("hkmbti_last_result");
if(last){ const r = JSON.parse(last); arr = [r]; }
 }
 }catch(e){}
if(!Array.isArray(arr)) return [];
 // 去重：舊版分享掣會喺同一段測試再存一次（同 mbti/名/版本，3 分鐘內）→ 只留最早嗰條
const seen = new Set(), clean = [];
let dirty = false;
arr.forEach(rec => {
if(!rec || !rec.mbti){ dirty = true; return; }
const ts = Number(rec.timestamp) || 0;
const k = [rec.mbti, rec.name||"", rec.nickname||"", rec.version||""].join("|");
const dup = clean.some(c => c._k === k && Math.abs((Number(c.timestamp)||0) - ts) <= 180000);
if(dup){ dirty = true; return; }
const item = Object.assign({}, rec, {_k:k});
if("cardShare" in item){ delete item.cardShare; dirty = true; }   // 舊版大圖唔再留
clean.push(item);
 });
if(dirty || clean.length !== arr.length){
try{ localStorage.setItem("hkmbti_history", JSON.stringify(clean.map(c => { const o = Object.assign({}, c); delete o._k; return o; }))); }catch(e){}
 }
return clean.map(c => { const o = Object.assign({}, c); delete o._k; return o; });
}
function loadCounts(){
let obj = {};
try{ obj = JSON.parse(localStorage.getItem("hkmbti_type_counts")||"{}") || {}; }catch(e){ obj = {}; }
return obj;
}

// 16 type meta
const TYPE_META = {
INTJ:{cn:"建築師",color:"#6B4E9E"}, INTP:{cn:"邏輯學家",color:"#3E5F9E"},
ENTJ:{cn:"指揮官",color:"#1E8A8A"}, ENTP:{cn:"辯論家",color:"#E07B35"},
INFJ:{cn:"提倡者",color:"#8A3E9E"}, INFP:{cn:"調解員",color:"#B085C4"},
ENFJ:{cn:"主人公",color:"#E05A4A"}, ENFP:{cn:"競選者",color:"#D9A028"},
ISTJ:{cn:"物流師",color:"#4A6E9E"}, ISFJ:{cn:"守衛者",color:"#5C8A5C"},
ESTJ:{cn:"總經理",color:"#A85240"}, ESFJ:{cn:"執事",color:"#E08058"},
ISTP:{cn:"鑒賞家",color:"#3E8A7A"}, ISFP:{cn:"探險家",color:"#C0709E"},
ESTP:{cn:"企業家",color:"#6B8A3E"}, ESFP:{cn:"表演者",color:"#C04070"}
};
const VER_LABEL = {life:"生活版", advanced:"進階版", bb:"BB版"};

function timeAgo(ts){
const ms = Date.now() - ts;
const m = Math.floor(ms/60000);
const h = Math.floor(ms/3600000);
const d = Math.floor(ms/86400000);
if(m < 1) return "啱啱";
if(h < 1) return m + " 分鐘前";
if(d < 1) return h + " 小時前";
if(d < 30) return d + " 日前";
const dt = new Date(ts);
return (dt.getMonth()+1) + "/" + dt.getDate();
}

VER_PILL = {life:"生活版", advanced:"進階版", bb:"BB版"};

function render(){
const list = loadHistory();
const counts = loadCounts();
 
 // 計算 summary
 // total = sum of counts (or list.length if counts empty)
const totalByCounts = Object.values(counts).reduce((a,b) => a + (parseInt(b,10)||0), 0);
const totalTests = totalByCounts || list.length;
document.getElementById("totalTests").textContent = totalTests;
 
 // types visited
const visited = Object.keys(counts).filter(k => (parseInt(counts[k],10)||0) > 0);
document.getElementById("typesVisited").innerHTML = visited.length + '<span style="font-size:18px;color:#888;"> / 16</span>';
 
 // history list — 編號固定 1..5（缺嘅就顯示 —）
const histBox = document.getElementById("historyList");
if(list.length === 0){
histBox.innerHTML = `
 <div class="empty">
 <div class="ico"></div>
 <div>暫時未有紀錄</div>
 <div style="margin-top:8px;font-size:12px;"><a href="./" style="color:var(--gold);">做完測試就會自動儲存</a></div>
 </div>`;
 } else {
histBox.innerHTML = list.map((rec, i) => {
const code = (rec.mbti||"").substring(0,4).toUpperCase();
const meta = TYPE_META[code] || {cn:code};
const verLabel = VER_PILL[rec.version] || rec.version || "—";
const name = [rec.name, rec.nickname].filter(Boolean).join(" · ") || "匿名港人";
const time = rec.timestamp ? timeAgo(rec.timestamp) : "";
const num = i + 1;
return `
 <div class="history-item">
 <div class="rec-num">#${num}</div>
 <div class="history-main">
 <div class="history-name">${escapeHtml(name)}</div>
 <div class="history-mbti">${code} · ${meta.cn}</div>
 <div class="history-meta">${escapeHtml(verLabel)} · ${time}</div>
 <div class="history-actions">
 <button type="button" class="act-view" aria-label="睇結果" onclick="viewRec('${escapeAttr(rec.id||"")}', ${i})"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
 <button type="button" class="act-share" aria-label="分享" onclick="shareRec(${i})"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11"/><path d="M8 8l4-4 4 4"/><path d="M6 14v5h12v-5"/></svg></button>
 <button type="button" class="act-del" aria-label="刪除" onclick="delRec(${i})"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14"/><path d="M10 7V5h4v2"/><path d="M8 7l1 12h6l1-12"/></svg></button>
 </div>
 </div>
 ${rec.card ? `<img src="${rec.card}" class="rec-card" alt="分享卡" role="button" tabindex="0" onclick="viewRec('${escapeAttr(rec.id||"")}', ${i})">` : ""}
 </div>`;
 }).join("");
 }
 
 // 16 型 stats
const grid = document.getElementById("statGrid");
grid.innerHTML = Object.keys(TYPE_META).map(code => {
const c = parseInt(counts[code]||0, 10) || 0;
const meta = TYPE_META[code];
const visited = c > 0;
const color = meta.color || "#999";
return `
 <button type="button" class="stat-pill ${visited ? "visited" : ""}" style="border-color:${color}" onclick="goType('${code}')">
 <span class="code" style="color:${visited ? "var(--gold)" : color}">${code}</span>
 <span style="display:block;font-size:10px;opacity:0.7;">${meta.cn}</span>
 <span class="count">${c > 0 ? c + "次" : "—"}</span>
 </button>`;
 }).join("");
}

function escapeHtml(s){
const map = {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"};
return String(s||"").replace(/[&<>"']/g, c => map[c]);
}
function escapeAttr(s){ return escapeHtml(s).replace(/`/g,"&#96;"); }

function toast(msg){
const t = document.getElementById("toast");
t.textContent = msg;
t.classList.add("show");
setTimeout(() => t.classList.remove("show"), 2200);
}

function viewRec(id, i){
 // 跳返主頁 replay history result，透過 hash #view={i}
 // 主頁 detect 到 #view=N 就自動 call viewHistoryResult(N)
try{
location.href = "./#view=" + i;
 }catch(e){ toast("跳轉失敗"); }
}

function goType(code){
 // 跳去主頁睇該類型嘅完整百科（#type=XXXX）
try{
location.href = "./#type=" + code;
 }catch(e){ toast("跳轉失敗"); }
}

async function shareRec(i){
const rec = loadHistory()[i];
if(!rec) return;
const src = rec.cardShare || rec.card;
const code = (rec.mbti||"").substring(0,4);
if(!src){
toast("呢筆未有分享卡圖片");
return;
 }
let file = null;
try{
const blob = await (await fetch(src)).blob();
const isPng = (blob.type||"").indexOf("png") >= 0 || src.indexOf("image/png") >= 0;
file = new File([blob], "港式MBTI-" + code + (isPng ? ".png" : ".jpg"), { type: blob.type || (isPng ? "image/png" : "image/jpeg") });
 }catch(e){ file = null; }
if(file && navigator.share && navigator.canShare){
let canFile = false;
try{ canFile = navigator.canShare({ files: [file] }); }catch(e){ canFile = false; }
if(canFile){
const attempts = [
 { files: [file] },
 { files: [file], text: "我嘅港式 MBTI：" + code }
 ];
for(const payload of attempts){
try{
await navigator.share(payload);
toast(" 已叫起分享");
return;
 }catch(e){
if(e && e.name === "AbortError") return;
 }
 }
 }
 }
try{
const a = document.createElement("a");
a.href = src;
a.download = "港式MBTI-" + code + ".jpg";
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
toast(" 已嘗試儲存分享卡");
 }catch(e2){
toast("分享失敗，請長按縮圖儲存");
 }
}

let _delArmTimer = null;
function delRec(i){
 // 兩段確認（armed 模式）
const btn = event.target;
if(btn.dataset.armed !== "1"){
btn.dataset.armed = "1";
btn.textContent = " 再撳一次";
btn.style.background = "#fdd";
clearTimeout(_delArmTimer);
 _delArmTimer = setTimeout(() => {
btn.dataset.armed = "";
btn.textContent = " 刪除";
btn.style.background = "";
 }, 5000);
return;
 }
clearTimeout(_delArmTimer);
if(!confirm("確定要刪除呢個紀錄？\n刪咗就返唔到。")) return;
 
let arr = loadHistory();
const removed = arr.splice(i, 1)[0];
localStorage.setItem("hkmbti_history", JSON.stringify(arr));
 
 // 同步 hkmbti_last_result（首筆）
try{
if(arr.length > 0){
localStorage.setItem("hkmbti_last_result", JSON.stringify(arr[0]));
 } else {
localStorage.removeItem("hkmbti_last_result");
 }
 }catch(e){}
 
 // 同步 type_counts -1
if(removed && removed.mbti){
const code = removed.mbti.substring(0,4).toUpperCase();
const counts = loadCounts();
if(counts[code]){
counts[code] = Math.max(0, (parseInt(counts[code],10)||0) - 1);
if(counts[code] === 0) delete counts[code];
localStorage.setItem("hkmbti_type_counts", JSON.stringify(counts));
 }
 }
 
toast(" 已刪除");
render();
}

function exportRecords(){
const data = {
exported_at: new Date().toISOString(),
site: "https://fung2222.github.io/hk-mbti/",
history: loadHistory(),
type_counts: loadCounts()
 };
const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
const url = URL.createObjectURL(blob);
const a = document.createElement("a");
a.href = url;
a.download = `hkmbti-records-${new Date().toISOString().slice(0,10)}.json`;
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
URL.revokeObjectURL(url);
toast(" 已匯出 JSON");
}

let _clearArmTimer = null;
function clearAllRecords(){
const btn = event.target;
if(btn.dataset.armed !== "1"){
btn.dataset.armed = "1";
btn.textContent = "再撳一次";
btn.style.background = "#fcc";
clearTimeout(_clearArmTimer);
 _clearArmTimer = setTimeout(() => {
btn.dataset.armed = "";
btn.textContent = "全部刪除";
btn.style.background = "";
 }, 5000);
return;
 }
clearTimeout(_clearArmTimer);
if(!confirm("確定要清除所有紀錄？\n（包括歷史 + 16 型統計）\n清除後無法復原。")) return;
 
localStorage.removeItem("hkmbti_history");
localStorage.removeItem("hkmbti_last_result");
localStorage.removeItem("hkmbti_type_counts");
 
toast(" 已全部清除");
render();
}

// SW
if("serviceWorker" in navigator){
navigator.serviceWorker.register("./sw.js").catch(()=>{});
}

render();
</script>
