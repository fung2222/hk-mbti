<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>香港16型人格統計 · 港式 MBTI</title>
<meta name="description" content="港式 MBTI 16 型公開分佈估算 + 本機完成次數。">
<meta name="theme-color" content="#1E2A3B">
<meta property="og:title" content="香港16型人格統計 · 港式 MBTI">
<meta property="og:description" content="16 型公開分佈估算 + 本機完成次數。">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700;900&display=swap');
:root{--gold:#D4A95F;--gold-dim:#B8A878;--ink:#0a0a1a;--soft:#FAF8F3;}
*{box-sizing:border-box;}
body{font-family:"PingFang HK","PingFang TC","Noto Sans HK","Microsoft JhengHei",sans-serif;background:var(--soft);color:var(--ink);margin:0;}
.brand-gold{color:var(--gold);}
.bg-soft{background:rgba(212,169,95,0.06);}
.hero{background:linear-gradient(135deg,#1E2A3B 0%,#3B4960 100%);color:white;padding:14px 16px 16px;text-align:left;}
.hero-row{position:relative;display:flex;align-items:center;min-height:44px;}
.hero-row h1{position:absolute;left:0;right:0;margin:0;padding:0 4.5rem;font-size:18px;font-weight:900;text-align:center;pointer-events:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:44px;}
.back-nav{position:relative;z-index:2;font-size:14px;line-height:1.25;color:rgba(255,255,255,.75);text-decoration:none;font-weight:400;background:none;border:0;padding:0;}
.back-nav:hover{color:#fff;}
.stat-bar{height:10px;background:rgba(255,255,255,0.08);background:#F3EEE4;border-radius:999px;overflow:hidden;}
.stat-fill{height:100%;background:linear-gradient(90deg,var(--gold),#e8b96d);border-radius:999px;}
.wrap{max-width:560px;margin:0 auto;padding:16px;}
</style>
</head>
<body>
<div class="hero">
  <div class="hero-row">
    <a href="./" class="back-nav">← 返回</a>
    <h1>香港16型人格統計</h1>
  </div>
  <p style="margin:6px 0 0;font-size:12px;opacity:.75;text-align:center;">公開分佈估算 + 本機完成次數 · 唔係全港普查</p>
</div>
<div class="wrap">
  <div class="flex justify-between text-xs text-gray-600 mb-3">
    <span>累積樣本 <b id="statTotal" class="brand-gold">—</b> 人</span>
    <span>香港人口約 <b>750 萬</b></span>
  </div>
  <div id="typeStats" class="space-y-2"></div>
  <p class="text-xs text-gray-500 mt-4 pt-3" style="border-top:1px solid #eee;">基線參考常見 16 型分佈 × 143,021 樣本量級；你喺呢部手機完成測試會 +1。唔係全港實時普查。</p>
</div>
<script>
window.STAT_BASE_PCT = {
  INFP:0.110, ENFP:0.092, ISFJ:0.088, ESFJ:0.085,
  ISTJ:0.078, ESTJ:0.072, ISFP:0.065, ESFP:0.060,
  INTP:0.055, ENTP:0.050, INFJ:0.048, ENFJ:0.045,
  INTJ:0.042, ENTJ:0.038, ISTP:0.036, ESTP:0.036
};
window.STAT_BASE_N = 143021;
window.HK_POP = 7500000;
window.TYPE_CN = {
  INTJ:"建築師", INTP:"邏輯學家", ENTJ:"指揮官", ENTP:"辯論家",
  INFJ:"提倡者", INFP:"調解員", ENFJ:"主人公", ENFP:"競選者",
  ISTJ:"物流師", ISFJ:"守衛者", ESTJ:"總經理", ESFJ:"執事",
  ISTP:"鑒賞家", ISFP:"探險家", ESTP:"企業家", ESFP:"表演者"
};
(function(){
  let local = {};
  try{ local = JSON.parse(localStorage.getItem("hkmbti_type_counts")||"{}") || {}; }catch(e){ local = {}; }
  const counts = {};
  let total = 0;
  Object.keys(window.STAT_BASE_PCT).forEach(k => {
    const n = Math.round(window.STAT_BASE_PCT[k] * window.STAT_BASE_N) + (parseInt(local[k]||0,10)||0);
    counts[k] = n; total += n;
  });
  document.getElementById("statTotal").innerText = total.toLocaleString("en-HK");
  const ranked = Object.keys(counts).sort((a,b) => counts[b]-counts[a]);
  const maxC = counts[ranked[0]] || 1;
  document.getElementById("typeStats").innerHTML = ranked.map((code, i) => {
    const n = counts[code];
    const pct = total ? (n/total*100) : 0;
    const hkEst = Math.round(window.HK_POP * (n/total));
    const bar = Math.max(4, Math.round(n/maxC*100));
    const medal = i===0 ? "🥇 " : i===1 ? "🥈 " : i===2 ? "🥉 " : "";
    const label = TYPE_CN[code] ? (code + " " + TYPE_CN[code]) : code;
    return '<div class="bg-soft rounded-lg p-2.5"><div class="flex justify-between items-baseline gap-2 mb-1"><span class="text-xs font-bold">'+medal+label+'</span><span class="text-xs brand-gold font-black">'+pct.toFixed(1)+'%</span></div><div class="stat-bar mb-1"><div class="stat-fill" style="width:'+bar+'%"></div></div><div class="flex justify-between text-xs text-gray-600"><span>'+n.toLocaleString("en-HK")+' 人</span><span>約香港 '+hkEst.toLocaleString("en-HK")+' 人</span></div></div>';
  }).join("");
})();
</script>
</body>
</html>
