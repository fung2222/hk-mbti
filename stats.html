<!-- 桌面／平板層開關（.dt）+ 手機「桌面版網站」還原（.dm）
     ① .dt：viewport ≥768px 而且實體螢幕唔細（≥680×600）→ 開桌面／平板排版。
     ② .dm：細螢幕被瀏覽器逼用寬虛擬視窗（例如手機開 Chrome「桌面版網站」，vw 980 / sw 412）
        → 用裝置真實寬度還原（html zoom），效果 1 CSS px ≈ 1 裝置 px，睇落同正常手機版一樣。
        高度用瀏覽器報嘅 visualViewport（已扣工具列）換算，並夾住唔可以高過螢幕。
        觸發條件極窄，正常手機（vw ≈ sw）同電腦（screen.width ≥680）永遠唔會有 .dm。 -->
<script>
(function(){
  var root = document.documentElement;
  function pick(){
    if(root.style.zoom) root.style.zoom = "";   /* 量度前先還原，數字要係未 zoom 嘅空間 */
    var vw = window.innerWidth || 0;
    var vh = window.innerHeight || 0;
    var sw = (window.screen && screen.width) || 0;
    var sh = (window.screen && screen.height) || 0;
    var vv = window.visualViewport;
    var sc = (vv && vv.scale) ? vv.scale : 1;
    var small = (sw > 0 && sw < 680) || (sh > 0 && sh < 600);   /* 手機／細平板 */
    /* ① 桌面／平板排版 */
    var dt = vw >= 768 && !small;
    if(sc < 0.9 && vw * sc < 700) dt = false;   /* 頁面被縮到細螢幕咁 → 唔當桌面 */
    if(dt) root.classList.add("dt"); else root.classList.remove("dt");
    root.style.setProperty("--sbw", Math.max(0, vw - (root.clientWidth || vw)) + "px");
    /* ② 桌面版網站還原：細螢幕（或頁面被縮細到細螢幕闊度）卻有寬虛擬視窗 */
    var eff = 0;
    if(small && sw > 0 && vw > sw * 1.45) eff = sw;                 /* 手機開桌面版網站 */
    else if(sc < 0.9 && vw * sc < 700) eff = Math.round(vw * sc);   /* screen 報大數嘅情況 */
    if(eff > 0){
      var z = Math.max(1.02, Math.min(3, vw / eff));
      /* 可視高度（扣工具列）換算成裝置 CSS px；再夾住唔可以高過螢幕 */
      var rawH = ((vv && vv.height > 0) ? vv.height : vh) / z;
      var cap = sh > 0 ? sh : rawH;
      var h = Math.round(Math.min(cap, Math.max(240, rawH)));
      root.style.setProperty("--dm-vw", eff + "px");
      root.style.setProperty("--dm-vh", h + "px");
      root.style.zoom = z;
      root.classList.add("dm");
    } else {
      root.style.zoom = "";
      root.classList.remove("dm");
    }
  }
  pick();
  window.addEventListener("resize", pick);
  window.addEventListener("orientationchange", pick);
})();
</script>

<style id="desktop-mode-fix">
/* 只喺 .dm 生效（細螢幕 + 寬虛擬視窗，例如手機開 Chrome「桌面版網站」）。
   把 app 自己用咗 viewport 單位嘅規則還原成裝置真實值（--dm-vw／--dm-vh 由 script 寫入），
   其他一律唔動 → 還原出嚟同正常手機版一模一樣。 */
</style>
<style id="dark-layer">

<div class="hero">

<div class="wrap">

<script>
function siteBack(){
try{
if(document.referrer){
var u = new URL(document.referrer, location.href);
if(u.origin === location.origin){ history.back(); return; }
 }
 }catch(e){}
location.href = './';
}

function toggleHeroMenu(e){
if(e) e.stopPropagation();
const p = document.getElementById('heroPopover');
if(p) p.classList.toggle('open');
}
function closeHeroMenu(){
const p = document.getElementById('heroPopover');
if(p) p.classList.remove('open');
}
document.addEventListener('click', function(e){
if(!e.target.closest('.hero-popover') && !e.target.closest('.hero-menu')) closeHeroMenu();
});
// 跨頁跳轉第二條渠道（同眼掣睇結果／人格圖一樣）：任何 ./#xxx 連結都寫低意圖。
// 主頁 load / hashchange / bfcache 還原三個入口都會試，hash 唔通都補得到位。
// 注意：一定要 capture 階段 —— 選單連結喺 .hero-popover 裏面，嗰度有
// onclick="event.stopPropagation()"，bubble 階段嘅 document listener 收唔到。
document.addEventListener('click', function(e){
try{
const t = e.target;
const a = (t && t.closest) ? t.closest('a[href^="./#"]') : null;
if(!a) return;
const h = String(a.getAttribute("href") || "").replace(/^\.\//, "");
if(h) sessionStorage.setItem("hkmbti_pending_screen", JSON.stringify({ h: h, t: Date.now() }));
 }catch(err){}
}, true);
window.STAT_BASE_PCT = {
INFP:0.110, ENFP:0.092, ISFJ:0.088, ESFJ:0.085,
ISTJ:0.078, ESTJ:0.072, ISFP:0.065, ESFP:0.060,
INTP:0.055, ENTP:0.050, INFJ:0.048, ENFJ:0.045,
INTJ:0.042, ENTJ:0.038, ISTP:0.036, ESTP:0.036
};
window.STAT_BASE_N = 143021;
window.HK_POP = 7500000;
window.TYPE_CN = {
INTJ:"建築師", INTP:"邏輯學家", ENTJ:"指揮官", ENTP:"辯論家",
INFJ:"提倡者", INFP:"調解員", ENFJ:"主人公", ENFP:"競選者",
ISTJ:"物流師", ISFJ:"守衛者", ESTJ:"總經理", ESFJ:"執事",
ISTP:"鑒賞家", ISFP:"探險家", ESTP:"企業家", ESFP:"表演者"
};
(function(){
let local = {};
try{ local = JSON.parse(localStorage.getItem("hkmbti_type_counts")||"{}") || {}; }catch(e){ local = {}; }
const counts = {};
let total = 0;
Object.keys(window.STAT_BASE_PCT).forEach(k => {
const n = Math.round(window.STAT_BASE_PCT[k] * window.STAT_BASE_N) + (parseInt(local[k]||0,10)||0);
counts[k] = n; total += n;
 });
document.getElementById("statTotal").innerText = total.toLocaleString("en-HK");
const ranked = Object.keys(counts).sort((a,b) => counts[b]-counts[a]);
const maxC = counts[ranked[0]] || 1;
document.getElementById("typeStats").innerHTML = ranked.map((code, i) => {
const n = counts[code];
const pct = total ? (n/total*100) : 0;
const hkEst = Math.round(window.HK_POP * (n/total));
const bar = Math.max(4, Math.round(n/maxC*100));
const medal = i < 3 ? '<span class="brand-gold" style="margin-right:4px">●</span>' : "";
const label = TYPE_CN[code] ? (code + " " + TYPE_CN[code]) : code;
return '<div class="bg-soft rounded-lg p-2.5"><div class="flex justify-between items-baseline gap-2 mb-1"><span class="text-xs font-bold">'+medal+label+'</span><span class="text-xs brand-gold font-black">'+pct.toFixed(1)+'%</span></div><div class="stat-bar mb-1"><div class="stat-fill" style="width:'+bar+'%"></div></div><div class="flex justify-between text-xs text-gray-600"><span>'+n.toLocaleString("en-HK")+' 人</span><span>約香港 '+hkEst.toLocaleString("en-HK")+' 人</span></div></div>';
 }).join("");
})();
</script>
<script>

document.addEventListener("contextmenu", function(e){
  var t = e.target;
  if(t && t.closest && t.closest("input,textarea,[contenteditable],img")) return;
  e.preventDefault();
});
</script>
</body>
